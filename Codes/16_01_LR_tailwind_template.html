<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waist Size Predictor</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-50 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md">
        <div class="text-center mb-8">
            <div class="bg-gradient-to-r from-blue-500 to-purple-600 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
                </svg>
            </div>
            <h1 class="text-3xl font-bold text-gray-800 mb-2">Waist Size Predictor</h1>
            <p class="text-gray-600">กรอกข้อมูลของคุณเพื่อทำนายขนาดรอบเอว</p>
        </div>

        <form id="predictForm" class="space-y-5">
            <div>
                <label for="sex" class="block text-sm font-semibold text-gray-700 mb-2">เพศ</label>
                <select id="sex" name="sex" required class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all outline-none bg-white">
                    <option value="1">ชาย (Male)</option>
                    <option value="0" selected>หญิง (Female)</option>
                </select>
            </div>

            <div>
                <label for="age" class="block text-sm font-semibold text-gray-700 mb-2">อายุ (ปี)</label>
                <input type="number" id="age" name="age" value="28" required class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all outline-none">
            </div>

            <div>
                <label for="weight" class="block text-sm font-semibold text-gray-700 mb-2">น้ำหนัก (kg)</label>
                <input type="number" id="weight" name="weight" value="75" step="0.1" required class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all outline-none">
            </div>

            <div>
                <label for="height" class="block text-sm font-semibold text-gray-700 mb-2">ส่วนสูง (cm)</label>
                <input type="number" id="height" name="height" value="178" step="0.1" required class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all outline-none">
            </div>

            <div>
                <label for="hip" class="block text-sm font-semibold text-gray-700 mb-2">รอบสะโพก (cm)</label>
                <input type="number" id="hip" name="hip" value="98" step="0.1" required class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all outline-none">
            </div>

            <button type="submit" class="w-full bg-gradient-to-r from-blue-500 to-purple-600 text-white font-semibold py-3 rounded-lg hover:from-blue-600 hover:to-purple-700 transition-all transform hover:scale-[1.02] active:scale-[0.98] shadow-lg">
                ทำนายขนาดรอบเอว
            </button>
        </form>

        <div id="resultContainer" class="mt-6 hidden">
            <div class="bg-gradient-to-r from-green-50 to-emerald-50 border-2 border-green-200 rounded-lg p-4 text-center">
                <p class="text-sm font-semibold text-green-700 mb-1">ผลการทำนาย</p>
                <h2 id="result" class="text-2xl font-bold text-green-800"></h2>
                <p id="bmi_result" class="text-sm text-gray-600 mt-1"></p>
            </div>
        </div>

        <div id="loadingContainer" class="mt-6 hidden">
            <div class="flex items-center justify-center space-x-2">
                <div class="w-2 h-2 bg-blue-500 rounded-full animate-bounce" style="animation-delay: 0s"></div>
                <div class="w-2 h-2 bg-purple-500 rounded-full animate-bounce" style="animation-delay: 0.1s"></div>
                <div class="w-2 h-2 bg-blue-500 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('predictForm').addEventListener('submit', function(event) {
            event.preventDefault();
            
            const loadingContainer = document.getElementById('loadingContainer');
            const resultContainer = document.getElementById('resultContainer');
            
            loadingContainer.classList.remove('hidden');
            resultContainer.classList.add('hidden');

            // --- START: การเปลี่ยนแปลง ---
            const weight = parseFloat(document.getElementById('weight').value);
            const height = parseFloat(document.getElementById('height').value);

            // คำนวณ BMI
            const heightInMeters = height / 100;
            const bmi = weight / (heightInMeters * heightInMeters);

            // สร้าง object ข้อมูลพร้อมกับ BMI
            const data = {
                sex: parseInt(document.getElementById('sex').value),
                age: parseInt(document.getElementById('age').value),
                weight: weight,
                height: height,
                hip: parseFloat(document.getElementById('hip').value),
                bmi: bmi // เพิ่ม BMI เข้าไปในข้อมูลที่จะส่ง
            };
            // --- END: การเปลี่ยนแปลง ---
            
            fetch('https://xxxxxxx.ngrok-free.app/predict', { // <-- อย่าลืมเปลี่ยน URL นี้เป็นของคุณ
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(result => {
                loadingContainer.classList.add('hidden');
                resultContainer.classList.remove('hidden');
                document.getElementById('result').innerText = 'รอบเอว: ' + result.predicted_waist.toFixed(2) + ' cm';
                // แสดงผล BMI ที่คำนวณได้
                document.getElementById('bmi_result').innerText = 'ค่า BMI ที่คำนวณได้: ' + bmi.toFixed(2);
            })
            .catch(error => {
                console.error('Error:', error);
                loadingContainer.classList.add('hidden');
                resultContainer.classList.remove('hidden');
                const resultDiv = resultContainer.querySelector('div');
                resultDiv.className = 'bg-gradient-to-r from-red-50 to-rose-50 border-2 border-red-200 rounded-lg p-4 text-center';
                resultDiv.querySelector('p').className = 'text-sm font-semibold text-red-700 mb-1';
                resultDiv.querySelector('p').innerText = 'เกิดข้อผิดพลาด';
                document.getElementById('result').className = 'text-lg font-bold text-red-800';
                document.getElementById('result').innerText = 'ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้';
                document.getElementById('bmi_result').innerText = ''; // ล้างข้อความ BMI หากเกิดข้อผิดพลาด
            });
        });
    </script>
</body>
</html>
